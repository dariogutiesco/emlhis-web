# Sitio estático: no hay nada que compilar.
[build]
  publish = "."
  command = ""

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Las tipografías no cambian nunca: caché de un año
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# URLs limpias: /madrid en vez de /madrid.html
[[redirects]]
  from = "/madrid"
  to = "/madrid.html"
  status = 200
[[redirects]]
  from = "/barcelona"
  to = "/barcelona.html"
  status = 200
[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200
